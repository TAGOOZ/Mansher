name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      # gtk4 0.11 needs rustc 1.92; stable may lag behind.
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Core tests
        run: cargo test -p mansher-core
      - name: App tests
        run: cargo test -p mansher-app
