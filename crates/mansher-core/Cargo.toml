[package]
name = "mansher-core"
version = "0.1.0"
edition = "2021"
description = "Portable clothesline model + inbox watcher for Mansher (Tendedero for Linux)"
license = "MIT"

[dependencies]
notify = "8"
directories = "6"
anyhow = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
