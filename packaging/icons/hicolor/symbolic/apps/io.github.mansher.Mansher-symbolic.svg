<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Pure monochrome, currentColor, snapped to 16x16 pixel grid -->
  <!-- Wire: continuous 2px line across y=3 and y=4 (height=2) -->
  <rect x="0" y="3" width="16" height="2" fill="currentColor"/>

  <!-- Pin 1: (x=2..3, y=1..5) - 2px wide, 5px tall -->
  <rect x="2" y="1" width="2" height="5" fill="currentColor"/>
  <!-- Card 1 (Left screenshot): 4px wide, 7px high (x=1..4, y=6..12) -->
  <rect x="1" y="6" width="4" height="7" rx="0.5" fill="currentColor"/>

  <!-- Pin 2: (x=7..8, y=1..5) - 2px wide, 5px tall -->
  <rect x="7" y="1" width="2" height="5" fill="currentColor"/>
  <!-- Card 2 (Center screenshot): 5px wide, 8px high (x=6..10, y=6..13) -->
  <rect x="6" y="6" width="5" height="8" rx="0.5" fill="currentColor"/>

  <!-- Pin 3: (x=12..13, y=1..5) - 2px wide, 5px tall -->
  <rect x="12" y="1" width="2" height="5" fill="currentColor"/>
  <!-- Card 3 (Right screenshot): 3px wide, 6px high (x=12..14, y=6..11) -->
  <rect x="12" y="6" width="3" height="6" rx="0.5" fill="currentColor"/>
</svg>
