<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft shadow for presentation scalability -->
    <filter id="flat-card-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="clip-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base App Frame (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="6"/>

  <!-- Continuous Clothesline Wire (Bold 64px equivalent to 2px at 16 scale) -->
  <rect id="clothesline-wire" x="24" y="128" width="464" height="48" rx="4" fill="#64748B"/>

  <!-- ==================== THREE FLAT COLOR CARDS ==================== -->
  <!-- Card 1: Left Card (Solid Deep Emerald/Teal #0D9488) -->
  <g id="card-left" filter="url(#flat-card-shadow)">
    <!-- 128x180 px rounded block, completely flat color, zero inner chrome/text -->
    <rect x="56" y="200" width="116" height="176" rx="16" fill="#0D9488"/>
  </g>

  <!-- Card 2: Center Hero Card (Solid Warm Terracotta/Tangerine #EA580C) -->
  <g id="card-center" filter="url(#flat-card-shadow)">
    <!-- 156x216 px rounded block, prominent hero dimension -->
    <rect x="188" y="176" width="144" height="216" rx="18" fill="#F97316"/>
  </g>

  <!-- Card 3: Right Card (Solid Electric Sky Cyan #0284C7) -->
  <g id="card-right" filter="url(#flat-card-shadow)">
    <!-- 108x160 px rounded block -->
    <rect x="348" y="200" width="108" height="160" rx="16" fill="#38BDF8"/>
  </g>

  <!-- ==================== SINGLE-SHAPE SIMPLIFIED PINS ==================== -->
  <!-- Clothespin 1: Single clean monolithic silhouette clamping line and card -->
  <g id="pin-left" filter="url(#clip-shadow)">
    <rect x="92" y="96" width="44" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="108" y="124" width="12" height="48" rx="6" fill="#94A3B8"/>
  </g>

  <!-- Clothespin 2: Center Pin -->
  <g id="pin-center" filter="url(#clip-shadow)">
    <rect x="238" y="96" width="44" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="254" y="124" width="12" height="48" rx="6" fill="#94A3B8"/>
  </g>

  <!-- Clothespin 3: Right Pin -->
  <g id="pin-right" filter="url(#clip-shadow)">
    <rect x="380" y="96" width="44" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="396" y="124" width="12" height="48" rx="6" fill="#94A3B8"/>
  </g>
</svg>
